<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b3fd1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="مغامرة إنقاذ مملكة الحروف: لعبة تعليمية لتعليم الحروف الهجائية العربية لطلبة الصف الأول">
  <title>مغامرة إنقاذ مملكة الحروف</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="sky" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div id="floaters"></div></div>
  <div id="map-stage" aria-label="خريطة المملكة"></div>

  <header id="topbar" class="hidden">
    <button id="tb-back" class="ib" aria-label="رجوع">→</button>
    <div id="tb-title"></div>
    <div class="tb-stats">
      <span class="chip" id="tb-stars" title="النجوم">⭐ <b>٠</b></span>
      <span class="chip" id="tb-keys" title="المفاتيح">🔑 <b>٠</b></span>
    </div>
    <button id="tb-badges" class="ib" aria-label="الإنجازات">🏆</button>
    <button id="tb-settings" class="ib" aria-label="الإعدادات">⚙️</button>
  </header>

  <main id="screen" tabindex="-1"></main>

  <div id="guide" class="hidden" aria-live="polite">
    <button id="guide-owl" aria-label="حكيم الحروف"></button>
    <div id="guide-bubble"><span id="guide-text"></span><button id="guide-replay" aria-label="أعد القول">🔊</button></div>
  </div>

  <div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="say-fallback" class="hidden" aria-live="assertive"></div>

  <noscript><p style="padding:2rem;font-size:1.4rem">يرجى تفعيل JavaScript لتشغيل اللعبة.</p></noscript>

  <script src="audio/manifest.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/map3d.js"></script>
  <script src="js/games.js"></script>
  <script src="js/export.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
